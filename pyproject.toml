[project]
name = "mokuro-fast"
authors = [
    {name = "Maciej Budyś", email = "kha-white@mail.com"},
    {name = "Jacob Keisling", email = "contact@keisling.me"},
]
description = "Browser reader for manga with selectable text"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
]

dynamic = ["version"]
dependencies = [
    "comic-text-detector",
    "fire",
    "loguru",
    "manga-ocr>=0.1.7",
    "natsort",
    "numpy",
    "opencv-python>=4.1.2",
    "Pillow>=7.1.2",
    "requests",
    "scipy",
    "setuptools<81",
    "torch>=1.7.0",
    "transformers>=4.25.0",
    "tqdm>=4.41.0",
    "yattag",
]

[project.optional-dependencies]
mlx = [
    "comic-text-detector[mlx]",
]

[project.urls]
Homepage = "https://github.com/EndlessReform/mokuro"

[build-system]
requires = ["setuptools >= 61.0.0", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mokuro_fast*"]

[tool.setuptools.dynamic]
version = {attr = "mokuro_fast._version.__version__"}

[tool.ruff]
line-length = 120
indent-width = 4
extend-exclude = ["comic_text_detector", "notebooks"]

[dependency-groups]
dev = [
    "pyinstrument>=5.1.2",
    "pytest",
    "ruff",
]

[tool.uv.workspace]
members = ["comic_text_detector"]

[tool.uv.sources]
comic-text-detector = { workspace = true }

[project.scripts]
mokuro-fast = "mokuro_fast.__main__:main"
